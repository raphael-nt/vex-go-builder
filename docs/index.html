<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEX GO Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen workbench. Header bar, part tray (left on wide screens, bottom drawer on narrow), 3D mat fills the rest, tools float on the mat. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#18202b; --muted:#5d6877; --line:#d5dbe3;
  --mat:#e3e9f0; --mat-line:#c9d3de;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#dfe9fb;
  --sun:#f4c21b; --warn:#c2361f; --warn-soft:#fbe3de; --ok:#25804a;
  --f-ui:"IBM Plex Sans Thai",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --thumb:#f3f5f8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2d3643;
  --mat:#1d242e; --mat-line:#2c3542; --accent:#6c9cf0; --accent-ink:#0d1420; --accent-soft:#223453;
  --sun:#f4c21b; --warn:#ff8a73; --warn-soft:#3c211d; --ok:#5cc988; --thumb:#cfd6df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2d3643;
  --mat:#1d242e; --mat-line:#2c3542; --accent:#6c9cf0; --accent-ink:#0d1420; --accent-soft:#223453;
  --sun:#f4c21b; --warn:#ff8a73; --warn-soft:#3c211d; --ok:#5cc988; --thumb:#cfd6df; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0} img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--accent);box-shadow:5px 5px 0 var(--sun);display:inline-block;margin-right:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-ui);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.lang button{padding:6px 10px;font-family:var(--f-num);font-size:12px}
.grow{flex:1}
.mname{min-width:0;flex:1 1 160px;max-width:260px;font:600 14px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--f-ui);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{position:relative;display:grid;grid-template-columns:var(--side-w,300px) minmax(0,1fr);min-height:0;min-width:0}
aside{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 12px 6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px var(--f-ui);padding:4px 10px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lib{flex:1;overflow:auto;padding:4px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;align-content:start}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:6px 6px 5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink);font-family:var(--f-ui)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%;background:var(--thumb);border-radius:7px}
.card .nm{font-size:11.5px;font-weight:600;line-height:1.25;min-height:2.5em}
.card .ct{font:500 11px var(--f-num);color:var(--muted)}
.card .ct.over{color:var(--warn)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.bom{padding:4px 12px 10px;height:var(--bom-h,220px);overflow:auto;flex:none}
/* drag handles: aside width (vsplit) and the used-parts box height (hsplit) */
.vsplit{position:absolute;top:0;bottom:0;left:var(--side-w,300px);width:12px;margin-left:-6px;cursor:col-resize;z-index:6;touch-action:none}
.vsplit::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.vsplit:hover::after,.vsplit.drag::after{background:var(--accent)}
.vsplit .grip{position:absolute;top:50%;left:1px;width:10px;height:44px;margin-top:-22px;border-radius:6px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 4px rgba(10,20,40,.12)}
.vsplit .grip::before{content:"";position:absolute;left:3px;top:12px;bottom:12px;width:2px;border-left:1px solid var(--muted);border-right:1px solid var(--muted)}
.hsplit{flex:none;height:14px;cursor:row-resize;position:relative;touch-action:none;border-top:1px solid var(--line)}
.hsplit::before{content:"";position:absolute;left:50%;top:4px;width:40px;height:5px;margin-left:-20px;border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.7}
.hsplit:hover,.hsplit.drag{background:var(--accent-soft)}
body.resizing{user-select:none;cursor:inherit}
main.side-off aside{overflow:hidden;border-right:0}
.bom h3,.steps h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bom ul,.steps ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.bom li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bom li .n{margin-left:auto;font:500 12px var(--f-num);font-variant-numeric:tabular-nums}
.bom li.over .n{color:var(--warn);font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.stage{position:relative;min-width:0;min-height:0;background:var(--mat)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(10,20,40,.12);max-width:calc(100% - 24px)}
.tools .btn{padding:8px 12px}
.tools kbd{font:500 10.5px var(--f-num);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px}
.hint{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;align-items:flex-start}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);box-shadow:0 2px 10px rgba(10,20,40,.08)}
.chip b{font-family:var(--f-num);font-weight:500}
.stepbox{display:flex;gap:6px;align-items:center}
.steps{flex:1;overflow:auto;padding:12px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;background:var(--bg)}
.steps li img{width:46px;height:46px;object-fit:contain;background:var(--thumb);border-radius:6px}
.steps li .q{margin-left:auto;font:600 15px var(--f-num)}
.stepnum{font:600 34px var(--f-num);line-height:1}
.stepnum small{font-size:15px;color:var(--muted)}
.reflink{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--accent)}
.instr-nav{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 6px 24px rgba(10,20,40,.12);width:min(560px,calc(100% - 24px))}
.instr-nav input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.instr-nav .btn{padding:10px 16px;font-weight:600}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:color-mix(in srgb,var(--mat) 70%,transparent);font-weight:600;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:20;padding:16px}
.sheet .box.wide{width:min(900px,100%);max-height:88vh}
.sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:80vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:17px}
.ohead{display:flex;align-items:center;gap:8px}
.ohead h2{flex:1}
.sheet h3{margin:6px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mcard{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;min-width:0}
.mcard:hover{border-color:var(--accent)}
.mopen{border:0;background:none;padding:0;margin:0;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column}
.mopen img,.mopen .ph{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--mat);display:block}
.mopen .ph{display:grid;place-items:center;font:300 40px var(--f-ui);color:var(--accent)}
.mopen .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mopen .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopen .meta{color:var(--muted);font-size:12px}
.mdel{position:absolute;top:6px;right:6px;font-size:12px;padding:4px 9px;border-radius:999px}
.hold{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:10px;background:var(--accent-soft);font-size:12.5px;font-weight:600;max-width:220px;min-width:0}
.hold img{width:34px;height:34px;object-fit:contain;background:var(--thumb);border-radius:8px;flex:none}
.hold span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.btn.icon{padding:6px 9px;display:inline-grid;place-items:center}
.btn.icon svg{width:18px;height:18px;display:block}
#hintL{min-width:0}
.vbar{position:absolute;right:12px;top:52px;display:flex;flex-direction:column;gap:4px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 4px 16px rgba(10,20,40,.1)}
.vbar button{border:0;background:transparent;color:var(--ink);font:600 11.5px var(--f-ui);padding:6px 8px;border-radius:8px;cursor:pointer;min-width:44px}
.vbar button:hover{background:var(--bg)} .vbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vbar hr{border:0;border-top:1px solid var(--line);margin:2px 4px}
.vpop{position:absolute;right:76px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;box-shadow:0 4px 16px rgba(10,20,40,.1);font-size:12.5px;font-weight:600}
.vpop input[type=range]{width:160px;accent-color:var(--accent)}
.ctx{position:absolute;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;min-width:190px;box-shadow:0 10px 30px rgba(10,20,40,.22);display:flex;flex-direction:column}
.ctx button{border:0;background:transparent;text-align:left;color:var(--ink);font:500 13px var(--f-ui);padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:14px}
.ctx button:hover,.ctx button:focus-visible{background:var(--bg)}
.ctx button kbd{font:500 11px var(--f-num);color:var(--muted)}
.ctx button.warn{color:var(--warn)} .ctx hr{border:0;border-top:1px solid var(--line);margin:3px 4px}
.gpanel{position:absolute;right:76px;top:52px;width:min(270px,calc(100% - 96px));max-height:calc(100% - 140px);overflow:auto;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(10,20,40,.14);display:flex;flex-direction:column;gap:8px}
.gitem{border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.gitem.on{border-color:var(--accent)}
.ghead{display:flex;align-items:center;gap:4px}
.ghead input{flex:1;min-width:0;font:600 13px var(--f-ui);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px}
.ghead input:hover,.ghead input:focus{border-color:var(--line);background:var(--panel)}
.ghead button{border:0;background:none;cursor:pointer;color:var(--muted);padding:4px;display:grid;font:600 12px var(--f-ui)}
.ghead svg{width:16px;height:16px}
.gitems{list-style:none;margin:4px 0 0;padding:0 0 0 22px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.gitems li{display:flex;gap:6px;align-items:center}
.gitems img{width:20px;height:20px;object-fit:contain;background:var(--thumb);border-radius:4px}
.selbox{position:absolute;z-index:7;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);pointer-events:none}
.mlabel{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-140%);background:var(--sun);color:#1a1a1a;font:600 12.5px var(--f-num);padding:4px 8px;border-radius:7px;white-space:nowrap}
.libtop{display:flex;flex-direction:column;gap:6px;padding:10px 12px 0}
.libtop input{font:500 13px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box}
.libtop .seg{width:max-content}
.tree{flex:1;overflow:auto;padding:6px 10px 12px;font-size:12.5px}
.tree h4{margin:10px 2px 4px;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tree .row{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:7px;cursor:pointer}
.tree .row:hover{background:var(--bg)} .tree .row[aria-selected="true"]{background:var(--accent-soft)}
.tree .row.off{opacity:.45}
.tree .row img{width:26px;height:26px;object-fit:contain;background:var(--thumb);border-radius:5px;flex:none}
.tree .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .row .gt{font:500 10.5px var(--f-num);color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 4px}
.tree .eye{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px;display:grid}
.tree .eye svg{width:16px;height:16px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.keys kbd{font:500 12px var(--f-num);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg);white-space:nowrap}
@media (max-width:640px){ .vbar{top:auto;bottom:86px;right:8px} .vbar button{min-width:38px;padding:5px 6px;font-size:11px} .vpop{right:8px;bottom:86px;top:auto!important} }
.tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,calc(-100% - 14px));background:var(--ink);color:var(--panel);font-weight:600;font-size:13px;padding:6px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 4px 14px rgba(10,20,40,.25)}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.tag small{display:block;font-weight:500;opacity:.75;font-size:11px}
.gallery{position:absolute;inset:0;background:var(--mat);display:grid;grid-template-rows:minmax(0,1fr) auto;touch-action:pan-y;user-select:none}
.gallery img{width:100%;height:100%;object-fit:contain;max-width:100%;display:block;pointer-events:none}
.gnav{display:flex;gap:8px;align-items:center;margin:0 auto calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;width:min(560px,calc(100% - 24px));box-shadow:0 6px 24px rgba(10,20,40,.12)}
.gnav input{flex:1;min-width:60px;accent-color:var(--accent)}
.gnav .cnt{font:500 12px var(--f-num);color:var(--muted);min-width:44px;text-align:center}
.gdots{display:flex;gap:5px;justify-content:center;padding:6px 0 0}
.vparts li{cursor:pointer}
.vparts li[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.slide{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:0 6px;color:var(--ink);flex:none}
.slide input{width:150px;accent-color:var(--accent)}
.tools #tPick{order:-2}
.tools #tMulti{order:9}
#tMulti[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tools #hold{order:-3} .tools #tCancel{order:-2} .tools #tPlace{order:-1}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mlist li .meta{color:var(--muted);font-size:12px}
.mlist li .grow{min-width:0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
@media (pointer:coarse){ .btn{min-height:42px} .tools .btn{padding:9px 14px} .tools kbd{display:none} .seg button{padding:8px 14px} }
@media (max-width:640px){
  header{gap:6px;padding-top:6px;padding-bottom:6px}
  .tools{left:8px;right:8px;transform:none;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tools .btn,.tools .hold{flex:none}
  .hold span{display:none}
  .brand .bt{display:none}
  .mname{order:10;flex:1 1 100%;max-width:none}
  .btn{padding:7px 10px}
  .seg button{padding:6px 11px}
  .hint{top:8px;left:8px;right:8px}
  .chip{font-size:12px}
}
@media (max-width:820px){
  .vsplit,.hsplit{display:none}
  .libtop{padding:8px 12px 0}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:42vh}
  .lib{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:92px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px}
  .bom{display:none}
  .stage{grid-row:1}
  .steps{max-height:30vh}
  .steps ul{flex-direction:row;overflow-x:auto}
  .steps li{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><i></i><span class="bt">VEX GO Builder</span></div>
    <div class="seg" role="group" data-i18n-aria="mode">
      <button id="mBuild" aria-pressed="true">Builder</button>
      <button id="mInstr" aria-pressed="false">Instructions</button>
      <button id="mView" aria-pressed="false">Showcase</button>
    </div>
    <input id="mname" class="mname" data-i18n-aria="modelName" maxlength="80">
    <div class="grow"></div>
    <div class="seg lang" role="group" data-i18n-aria="language">
      <button id="lTh" aria-pressed="true" lang="th">TH</button>
      <button id="lEn" aria-pressed="false" lang="en">EN</button>
    </div>
    <button class="btn icon" id="bFull" hidden></button>

/* A part is a list of primitives, one per CAD color: {g: geometry in part space, name: material name, hex: CAD color}.
   GLB files are meshopt compressed and quantized, so attributes are expanded to Float32 before baking the node transform. */
function toFloat(attr){ const n=attr.count, k=attr.itemSize, a=new Float32Array(n*k); for(let i=0;i<n;i++) for(let j=0;j<k;j++) a[i*k+j]=attr.getComponent(i,j); return new THREE.BufferAttribute(a,k); }

    const g=await loader.loadAsync('m/'+PART[sid].file+'.glb');
    g.scene.updateMatrixWorld(true);
    const prims=[], box=new THREE.Box3();
    g.scene.traverse(o=>{
      if(!o.isMesh) return;
      const gg=new THREE.BufferGeometry();
      gg.setAttribute('position',toFloat(o.geometry.attributes.position));
      if(o.geometry.attributes.normal) gg.setAttribute('normal',toFloat(o.geometry.attributes.normal));
      if(o.geometry.index) gg.setIndex(o.geometry.index);
      gg.applyMatrix4(o.matrixWorld);
      if(!gg.attributes.normal) gg.computeVertexNormals();
      gg.computeBoundingBox(); gg.computeBoundingSphere(); gg.computeBoundsTree();
      box.union(gg.boundingBox);
      prims.push({g:gg,name:o.material.name||'',hex:'#'+o.material.color.getHexString(THREE.SRGBColorSpace)});
    });
    return {prims,box};

  p.catch(()=>{ if(geoCache[sid]===p) delete geoCache[sid]; });   // a failed fetch must be retryable

}

}

const geoAll=ids=>Promise.all(ids.map(ensureGeo));

/* ---------- connectors ---------- */

  const CELL=2, cell=v=>Math.floor(v/CELL), key=(x,y,z)=>x+','+y+','+z;
  const bucket=new Map();
  for(const c of allConns){const k=key(cell(c.p.x),cell(c.p.y),cell(c.p.z)); let a=bucket.get(k); if(!a) bucket.set(k,a=[]); a.push(c);}

      const a=bucket.get(key(x,y,z)); if(!a) continue;

}

/* ---------- scene sync ---------- */
const meshes=[]; let syncSeq=0;
async function syncScene(visibleUpTo=Infinity,animStep=null){
  const my=++syncSeq;
  await Promise.all([...new Set(model.parts.map(p=>p.sid))].map(ensureGeo));
  if(my!==syncSeq) return;               // a newer sync started while we awaited; it will draw
  root.clear(); meshes.length=0;         // clear only after the await so two syncs can never both add
  model.parts.forEach((p,i)=>{
    if(p.step>visibleUpTo||p._h) return;
    const home=V(p.p), dir=V(p.dir||[0,0,1]), anim=animStep!==null&&p.step===animStep;
    for(const m of partMeshes(p.sid,p.col,(i===selected||selSet.has(i))?'s':(p.lock?'k':''))){
      m.position.copy(home); m.quaternion.fromArray(p.q); m.userData={i,home,dir,anim,hex:m.userData.hex,c:geoCache[p.sid]._v.box.getCenter(new THREE.Vector3()).applyQuaternion(m.quaternion).add(home)};
      root.add(m); meshes.push(m);

}

let ghost=null, pose=null;
async function updateGhost(){
  ghostRoot.clear(); ghost=null; pose=null; hl.visible=false; need();

  await geoAll(armed.group?[...new Set(armed.group.map(m=>m.sid))]:[armed.sid]);
  if(!armed||!hover) { updateHint(); return; }
  if(hover.type==='conn'){
    const ch=chosenOption(hover.c); if(!ch){updateHint();return;}
    pose=snapPose(hover.c,ch.j,spin);
    hl.position.copy(hover.c.p); hl.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),hover.c.n); hl.visible=true;
  } else pose=groundPose(hover.pt);
  ghostRoot.clear();
  ghost=new THREE.Group();
  if(armed.group) for(const g of armed.group){ for(const m of partMeshes(g.sid,g.col,'g')){ m.position.copy(g.pos); m.quaternion.copy(g.q); ghost.add(m); } }
  else for(const m of partMeshes(armed.sid,armed.col,'g')) ghost.add(m);
  ghost.position.copy(pose.pos); ghost.quaternion.copy(pose.q); ghostRoot.add(ghost);

}
function updateHint(){
  if(PART&&CATALOG) refreshTools();

  if(mode!=='build'){h.hidden=true;return;} h.hidden=false;
  if(measureOn){ h.textContent=t('hMeasure'); return; }
  if(selSet.size>1){ h.textContent=t('hMulti',selSet.size); return; }
  if(selected>=0){h.textContent=t(slideInfo?'hSelSlide':'hSel',PART[model.parts[selected].sid].name); return;}
  if(!armed){h.textContent=t(model.parts.length?'hPick':'hFirst'); return;}
  const nm=armed.group?t('groupOf',armed.group.length):PART[armed.sid].name;
  if(collide&&hover){ h.textContent=t('hCollide'); return; }

/* pick up the whole selection: positions and free connectors are stored relative to the clicked part */
function makeGroup(idx,primary){
  idx=[...idx].sort((a,b)=>a-b); const A=model.parts[primary];
  const qA=new THREE.Quaternion(...A.q), qAi=qA.clone().invert(), pA=V(A.p);
  const group=idx.map(i=>{ const p=model.parts[i]; return {sid:p.sid,col:p.col,hex:p.hex,pos:V(p.p).sub(pA).applyQuaternion(qAi),q:qAi.clone().multiply(new THREE.Quaternion(...p.q))}; });
  const all=idx.flatMap(i=>worldConns(i));
  const free=all.filter(c=>!all.some(o=>o.i!==c.i&&o.p.distanceToSquared(c.p)<.64&&o.n.dot(c.n)<-.9));
  const conns=free.map(c=>({k:c.k,p:c.p.clone().sub(pA).applyQuaternion(qAi).toArray(),n:c.n.clone().applyQuaternion(qAi).toArray()}));
  const lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
  for(const g of group){ const b=PART[g.sid].bounds; for(const x of [b[0][0],b[1][0]]) for(const y of [b[0][1],b[1][1]]) for(const z of [b[0][2],b[1][2]]){ const v=new THREE.Vector3(x,y,z).applyQuaternion(g.q).add(g.pos).toArray(); for(let k=0;k<3;k++){ lo[k]=Math.min(lo[k],v[k]); hi[k]=Math.max(hi[k],v[k]); } } }
  const gids=new Set(idx.map(i=>model.parts[i].g)), gid=gids.size===1&&[...gids][0]?[...gids][0]:false;
  return {sid:A.sid,col:A.col,hex:A.hex,group,conns,bounds:[lo,hi],gid};
}

  if(b.isEmpty()) return gal={key,imgs:[]};

  const cam=camera.clone(), vf=cam.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*cam.aspect), d=Math.max(90,rad/Math.sin(Math.min(vf,hf))*1.05), el=24*Math.PI/180;

    const a=-Math.PI/2+k*Math.PI/5;

function saveDraft(){

    if(edited) localStorage.setItem('vexgo-draft',JSON.stringify({edited:true,modelId,model:{name:model.name,ref:model.ref,step:model.step,groups:model.groups,parts:model.parts.map(({sid,col,p,q,dir,step,g})=>({sid,col,p,q,dir,step,...(g?{g}:{})}))}}));

  }catch{}
}
const num3=a=>Array.isArray(a)&&a.length===3&&a.every(x=>typeof x==='number'&&isFinite(x)&&Math.abs(x)<5000);
function cleanModel(m){
  if(!m||typeof m!=='object'||!Array.isArray(m.parts)) throw new Error('bad model');
  const parts=[];
  for(const p of m.parts.slice(0,MAX_PARTS)){
    if(!p||typeof p!=='object') continue;
    const P=PART[p.sid]; if(!P) continue;
    if(!num3(p.p)||!Array.isArray(p.q)||p.q.length!==4||!p.q.every(x=>typeof x==='number'&&isFinite(x))) continue;
    const ql=Math.hypot(...p.q); if(ql<1e-6) continue;
    const c=P.colors.find(c=>c.c===p.col)||P.colors[0];
    const step=Math.min(999,Math.max(1,Math.floor(Number(p.step))||1));
    const g=typeof p.g==='string'&&/^[\w-]{1,24}$/.test(p.g)?p.g:undefined;
    parts.push({sid:p.sid,col:c.c,hex:c.hex,p:p.p.slice(),q:p.q.map(x=>x/ql),dir:num3(p.dir)?p.dir.slice():[0,0,1],step,...(g?{g}:{}),...(p.lock===true?{lock:true}:{})});
  }
  let ref=null; try{ const u=new URL(String(m.ref||'')); if(u.protocol==='https:') ref=u.href; }catch{}   // never let a shared file inject a javascript: link
  const maxStep=Math.max(1,...parts.map(p=>p.step));
  const groups={}; const used=new Set(parts.map(p=>p.g).filter(Boolean));
  if(m.groups&&typeof m.groups==='object') for(const [k,v] of Object.entries(m.groups)) if(used.has(k)&&typeof v==='string') groups[k]=v.slice(0,40);
  return {name:String(m.name||'').slice(0,80),parts,groups,step:Math.max(maxStep,Math.min(999,Math.floor(Number(m.step))||1)),ref};
}

    let v=start.v+(axis==='x'?d:-d); v=Math.max(0,Math.min(maxFn(),v)); if(v<min) v=v<min/2?0:min; sizes[key]=Math.round(v); applySizes(); });
  const end=()=>{ if(!start) return; start=null; el.classList.remove('drag'); document.body.classList.remove('resizing'); if(sizes[key]>0) sizes[key+'Old']=sizes[key]; applySizes(); };

/* ---- collision warning: ghost vertices that end up deep inside a placed part ---- */
let collide=false, colTok=0;
const colDirs=[new THREE.Vector3(1,.13,.07).normalize(),new THREE.Vector3(-.11,1,.17).normalize(),new THREE.Vector3(.09,-.15,-1).normalize()];
async function checkCollision(){
  const tok=++colTok; await new Promise(r=>setTimeout(r,40)); if(tok!==colTok||!ghost||!armed) return;
  root.updateMatrixWorld(true); ghost.updateMatrixWorld(true);
  const gbox=new THREE.Box3().setFromObject(ghost), byPart=new Map();
  for(const m of meshes){ const b=m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld); if(!b.intersectsBox(gbox)) continue; const i=m.userData.i; if(!byPart.has(i)) byPart.set(i,[]); byPart.get(i).push(m); }
  if(!byPart.size) return;
  const rc=new THREE.Raycaster(), v=new THREE.Vector3(), lv=new THREE.Vector3(), inv=new THREE.Matrix4(), tmp={point:new THREE.Vector3(),distance:0};
  let inside=0,total=0;
  for(const gm of ghost.children){ const pa=gm.geometry.attributes.position, step=Math.max(1,Math.floor(pa.count/250));
    for(let k=0;k<pa.count;k+=step){ v.fromBufferAttribute(pa,k).applyMatrix4(gm.matrixWorld); total++;
      for(const ms of byPart.values()){ let odd=0; for(const d of colDirs){ rc.set(v,d); if(rc.intersectObjects(ms,false).length%2) odd++; } if(odd<2) continue;
        let dmin=1e9; for(const m of ms){ inv.copy(m.matrixWorld).invert(); lv.copy(v).applyMatrix4(inv); const r=m.geometry.boundsTree.closestPointToPoint(lv,tmp); if(r) dmin=Math.min(dmin,r.distance); }
        if(dmin>2){ inside++; break; } } } }
  if(tok!==colTok||!ghost) return;
  collide=inside/Math.max(1,total)>.02;
  if(collide){ ghost.traverse(o=>{ if(o.isMesh) o.material=mat('#e5484d','g'); }); need(); updateHint(); }
}
