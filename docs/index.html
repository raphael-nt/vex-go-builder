<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VEX GO Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen workbench. Header bar, part tray (left on wide screens, bottom drawer on narrow), 3D mat fills the rest, tools float on the mat. */
:root{
  --bg:#eef1f5; --panel:#ffffff; --ink:#18202b; --muted:#5d6877; --line:#d5dbe3;
  --mat:#e3e9f0; --mat-line:#c9d3de;
  --accent:#1f5fd1; --accent-ink:#ffffff; --accent-soft:#dfe9fb;
  --sun:#f4c21b; --warn:#c2361f; --warn-soft:#fbe3de; --ok:#25804a;
  --f-ui:"IBM Plex Sans Thai",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --thumb:#f3f5f8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2d3643;
  --mat:#1d242e; --mat-line:#2c3542; --accent:#6c9cf0; --accent-ink:#0d1420; --accent-soft:#223453;
  --sun:#f4c21b; --warn:#ff8a73; --warn-soft:#3c211d; --ok:#5cc988; --thumb:#cfd6df; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --ink:#e7ecf2; --muted:#9aa6b5; --line:#2d3643;
  --mat:#1d242e; --mat-line:#2c3542; --accent:#6c9cf0; --accent-ink:#0d1420; --accent-soft:#223453;
  --sun:#f4c21b; --warn:#ff8a73; --warn-soft:#3c211d; --ok:#5cc988; --thumb:#cfd6df; color-scheme:dark}
[hidden]{display:none!important}
body{margin:0} img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:16px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:14px;height:14px;border-radius:3px;background:var(--accent);box-shadow:5px 5px 0 var(--sun);display:inline-block;margin-right:6px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-ui);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.lang button{padding:6px 10px;font-family:var(--f-num);font-size:12px}
.grow{flex:1}
.mname{min-width:0;flex:1 1 160px;max-width:260px;font:600 14px var(--f-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 13px var(--f-ui);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{position:relative;display:grid;grid-template-columns:var(--side-w,300px) minmax(0,1fr);min-height:0;min-width:0}
aside{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 12px 6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);font:500 12px var(--f-ui);padding:4px 10px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.lib{flex:1;overflow:auto;padding:4px 12px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;align-content:start}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:6px 6px 5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;color:var(--ink);font-family:var(--f-ui)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%;background:var(--thumb);border-radius:7px}
.card .nm{font-size:11.5px;font-weight:600;line-height:1.25;min-height:2.5em}
.card .ct{font:500 11px var(--f-num);color:var(--muted)}
.card .ct.over{color:var(--warn)}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--accent-soft)}
.bom{padding:4px 12px 10px;height:var(--bom-h,220px);overflow:auto;flex:none}
/* drag handles: aside width (vsplit) and the used-parts box height (hsplit) */
.vsplit{position:absolute;top:0;bottom:0;left:var(--side-w,300px);width:12px;margin-left:-6px;cursor:col-resize;z-index:6;touch-action:none}
.vsplit::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:transparent;transition:background .15s}
.vsplit:hover::after,.vsplit.drag::after{background:var(--accent)}
.vsplit .grip{position:absolute;top:50%;left:1px;width:10px;height:44px;margin-top:-22px;border-radius:6px;background:var(--panel);border:1px solid var(--line);box-shadow:0 1px 4px rgba(10,20,40,.12)}
.vsplit .grip::before{content:"";position:absolute;left:3px;top:12px;bottom:12px;width:2px;border-left:1px solid var(--muted);border-right:1px solid var(--muted)}
.hsplit{flex:none;height:14px;cursor:row-resize;position:relative;touch-action:none;border-top:1px solid var(--line)}
.hsplit::before{content:"";position:absolute;left:50%;top:4px;width:40px;height:5px;margin-left:-20px;border-top:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.7}
.hsplit:hover,.hsplit.drag{background:var(--accent-soft)}
body.resizing{user-select:none;cursor:inherit}
main.side-off aside{overflow:hidden;border-right:0}
.bom h3,.steps h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.bom ul,.steps ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.bom li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.bom li .n{margin-left:auto;font:500 12px var(--f-num);font-variant-numeric:tabular-nums}
.bom li.over .n{color:var(--warn);font-weight:700}
.dot{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2)}
.stage{position:relative;min-width:0;min-height:0;background:var(--mat)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px rgba(10,20,40,.12);max-width:calc(100% - 24px)}
.tools .btn{padding:8px 12px}
.tools kbd{font:500 10.5px var(--f-num);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:5px}
.hint{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;align-items:flex-start}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);box-shadow:0 2px 10px rgba(10,20,40,.08)}
.chip b{font-family:var(--f-num);font-weight:500}
.stepbox{display:flex;gap:6px;align-items:center}
.steps{flex:1;overflow:auto;padding:12px}
.steps li{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;background:var(--bg)}
.steps li img{width:46px;height:46px;object-fit:contain;background:var(--thumb);border-radius:6px}
.steps li .q{margin-left:auto;font:600 15px var(--f-num)}
.stepnum{font:600 34px var(--f-num);line-height:1}
.stepnum small{font-size:15px;color:var(--muted)}
.reflink{display:inline-block;margin-top:10px;font-size:13px;font-weight:600;color:var(--accent)}
.instr-nav{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:0 6px 24px rgba(10,20,40,.12);width:min(560px,calc(100% - 24px))}
.instr-nav input[type=range]{flex:1;min-width:60px;accent-color:var(--accent)}
.instr-nav .btn{padding:10px 16px;font-weight:600}
.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:color-mix(in srgb,var(--mat) 70%,transparent);font-weight:600;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(10,15,25,.45);display:grid;place-items:center;z-index:20;padding:16px}
.sheet .box.wide{width:min(900px,100%);max-height:88vh}
.sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(460px,100%);max-height:80vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:17px}
.ohead{display:flex;align-items:center;gap:8px}
.ohead h2{flex:1}
.sheet h3{margin:6px 0 0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.mcard{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;min-width:0}
.mcard:hover{border-color:var(--accent)}
.mopen{border:0;background:none;padding:0;margin:0;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column}
.mopen img,.mopen .ph{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--mat);display:block}
.mopen .ph{display:grid;place-items:center;font:300 40px var(--f-ui);color:var(--accent)}
.mopen .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mopen .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mopen .meta{color:var(--muted);font-size:12px}
.mdel{position:absolute;top:6px;right:6px;font-size:12px;padding:4px 9px;border-radius:999px}
.hold{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:10px;background:var(--accent-soft);font-size:12.5px;font-weight:600;max-width:220px;min-width:0}
.hold img{width:34px;height:34px;object-fit:contain;background:var(--thumb);border-radius:8px;flex:none}
.hold span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.btn.icon{padding:6px 9px;display:inline-grid;place-items:center}
.btn.icon svg{width:18px;height:18px;display:block}
#hintL{min-width:0}
.tag{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,calc(-100% - 14px));background:var(--ink);color:var(--panel);font-weight:600;font-size:13px;padding:6px 10px;border-radius:9px;white-space:nowrap;box-shadow:0 4px 14px rgba(10,20,40,.25)}
.tag::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-bottom:0;border-top-color:var(--ink)}
.tag small{display:block;font-weight:500;opacity:.75;font-size:11px}
.gallery{position:absolute;inset:0;background:var(--mat);display:grid;grid-template-rows:minmax(0,1fr) auto;touch-action:pan-y;user-select:none}
.gallery img{width:100%;height:100%;object-fit:contain;max-width:100%;display:block;pointer-events:none}
.gnav{display:flex;gap:8px;align-items:center;margin:0 auto calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 8px;width:min(560px,calc(100% - 24px));box-shadow:0 6px 24px rgba(10,20,40,.12)}
.gnav input{flex:1;min-width:60px;accent-color:var(--accent)}
.gnav .cnt{font:500 12px var(--f-num);color:var(--muted);min-width:44px;text-align:center}
.gdots{display:flex;gap:5px;justify-content:center;padding:6px 0 0}
.vparts li{cursor:pointer}
.vparts li[aria-pressed="true"]{outline:2px solid var(--accent);background:var(--accent-soft)}
.slide{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;padding:0 6px;color:var(--ink);flex:none}
.slide input{width:150px;accent-color:var(--accent)}
.tools #tPick{order:-2}
.tools #hold{order:-3} .tools #tCancel{order:-2} .tools #tPlace{order:-1}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mlist li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.mlist li .meta{color:var(--muted);font-size:12px}
.mlist li .grow{min-width:0}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
@media (pointer:coarse){ .btn{min-height:42px} .tools .btn{padding:9px 14px} .tools kbd{display:none} .seg button{padding:8px 14px} }
@media (max-width:640px){
  header{gap:6px;padding-top:6px;padding-bottom:6px}
  .tools{left:8px;right:8px;transform:none;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tools .btn,.tools .hold{flex:none}
  .hold span{display:none}
  .brand .bt{display:none}
  .mname{order:10;flex:1 1 100%;max-width:none}
  .btn{padding:7px 10px}
  .seg button{padding:6px 11px}
  .hint{top:8px;left:8px;right:8px}
  .chip{font-size:12px}
}
@media (max-width:820px){
  .vsplit,.hsplit{display:none}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  aside{grid-row:2;border-right:0;border-top:1px solid var(--line);max-height:42vh}
  .lib{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:92px;overflow-x:auto;overflow-y:hidden;padding-bottom:10px}
  .bom{display:none}
  .stage{grid-row:1}
  .steps{max-height:30vh}
  .steps ul{flex-direction:row;overflow-x:auto}
  .steps li{flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><i></i><span class="bt">VEX GO Builder</span></div>
    <div class="seg" role="group" data-i18n-aria="mode">
      <button id="mBuild" aria-pressed="true">Builder</button>
      <button id="mInstr" aria-pressed="false">Instructions</button>
      <button id="mView" aria-pressed="false">Showcase</button>
    </div>
    <input id="mname" class="mname" data-i18n-aria="modelName" maxlength="80">
    <div class="grow"></div>
    <div class="seg lang" role="group" data-i18n-aria="language">
      <button id="lTh" aria-pressed="true" lang="th">TH</button>
      <button id="lEn" aria-pressed="false" lang="en">EN</button>
    </div>
    <button class="btn icon" id="bFull" hidden></button>
    <button class="btn icon" id="bSnd" aria-pressed="true"></button>
    <button class="btn" id="bOpen" data-i18n="open">Open</button>
    <button class="btn primary" id="bSave" data-i18n="save">Save</button>
    <button class="btn" id="bMore" data-i18n="file">File</button>
  </header>
  <main>
    <aside id="side">
      <div id="buildSide" style="display:contents">
        <div class="tabs" id="tabs"></div>
        <div class="lib" id="lib"></div>
        <div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-title="resizeHint"></div>
        <div class="bom" id="bomBox"><h3 data-i18n="bomTitle"></h3><ul id="bom"></ul></div>
      </div>
      <div id="instrSide" class="steps" hidden>
        <div class="stepnum" id="stepNum">1 <small>/ 1</small></div>
        <a id="refLink" class="reflink" target="_blank" rel="noopener noreferrer" hidden data-i18n="refLink"></a>
        <h3 style="margin-top:12px" data-i18n="stepPartsTitle"></h3>
        <ul id="stepParts"></ul>
      </div>
      <div id="viewSide" class="steps" hidden>
        <div class="seg" role="group" style="width:max-content"><button id="v3d" aria-pressed="true">3D</button><button id="v2d" aria-pressed="false">2D</button></div>
        <h3 style="margin-top:14px" data-i18n="viewParts"></h3>
        <ul id="viewParts" class="vparts"></ul>
      </div>
    </aside>
    <div class="vsplit" id="vsplit" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="resizeHint"><span class="grip"></span></div>
    <section class="stage" id="stage">
      <canvas id="c" role="img" data-i18n-aria="canvas"></canvas>
      <div class="hint">
        <div class="chip" id="hintL"></div>
        <div class="chip stepbox" id="stepChip">Step <b id="curStep">1</b></div>
      </div>
      <div class="tools" id="tools">
        <div class="hold" id="hold" hidden><img alt=""><span></span></div>
        <button class="btn" id="tRot"><span data-i18n="rotate"></span><kbd>R</kbd></button>
        <button class="btn" id="tPt"><span data-i18n="changeHole"></span><kbd>T</kbd></button>
        <button class="btn" id="tDepth" hidden><span data-i18n="depth"></span> <b id="tDepthN"></b><kbd>D</kbd></button>
        <button class="btn" id="tTilt"><span data-i18n="tilt"></span><kbd>F</kbd></button>
        <button class="btn primary" id="tPlace" data-i18n="place"></button>
        <button class="btn" id="tUndo">Undo</button>
        <button class="btn primary" id="tPick" hidden data-i18n="pickUp"></button>
        <label class="slide" id="slideBox" hidden><span data-i18n="slide"></span><input type="range" id="tSlide" step="0.25"></label>
        <button class="btn warn" id="tDel" hidden data-i18n="delPart"></button>
        <button class="btn" id="tCancel" hidden></button>
        <button class="btn" id="tStep" data-i18n="newStep"></button>
      </div>
      <div class="instr-nav" id="instrNav" hidden>
        <button class="btn" id="iPrev" data-i18n="prev"></button>
        <input type="range" id="iRange" min="1" max="1" value="1" data-i18n-aria="chooseStep">
        <button class="btn primary" id="iNext" data-i18n="next"></button>
      </div>
      <div class="tag" id="tag" hidden></div>
      <div class="gallery" id="gallery" hidden>
        <img id="gImg" alt="">
        <div>
          <div class="gnav"><button class="btn" id="gPrev" data-i18n="prev"></button><input type="range" id="gRange" min="1" max="10" value="1" data-i18n-aria="angleOf"><span class="cnt" id="gCnt"></span><button class="btn primary" id="gNext" data-i18n="next"></button></div>
        </div>
      </div>
      <div class="overlay" id="loading" role="status"></div>
    </section>
  </main>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {computeBoundsTree,acceleratedRaycast} from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree; THREE.Mesh.prototype.raycast=acceleratedRaycast;   // BVH picking, full CAD meshes are dense

const $=id=>document.getElementById(id);

/* ---------- language ---------- */
const L={
th:{
  mode:'โหมด',modelName:'ชื่อโมเดล',language:'ภาษา',newModel:'โมเดลใหม่',modelDefault:'โมเดล',
  open:'เปิดโมเดล',save:'บันทึก',file:'ไฟล์',
  bomTitle:'ชิ้นที่ใช้ เทียบกับในกล่อง',bomEmpty:'ยังไม่มีชิ้น',

/* ---------- loading ---------- */
/* A part is a list of primitives, one per CAD color: {g: geometry in part space, name: material name, hex: CAD color}.
   GLB files are meshopt compressed and quantized, so attributes are expanded to Float32 before baking the node transform. */
function toFloat(attr){ const n=attr.count, k=attr.itemSize, a=new Float32Array(n*k); for(let i=0;i<n;i++) for(let j=0;j<k;j++) a[i*k+j]=attr.getComponent(i,j); return new THREE.BufferAttribute(a,k); }
async function geo(sid){
  if(geoCache[sid]) return geoCache[sid];
  const p=(async()=>{
    const g=await loader.loadAsync('m/'+PART[sid].file+'.glb');
    g.scene.updateMatrixWorld(true);
    const prims=[], box=new THREE.Box3();
    g.scene.traverse(o=>{
      if(!o.isMesh) return;
      const gg=new THREE.BufferGeometry();
      gg.setAttribute('position',toFloat(o.geometry.attributes.position));
      if(o.geometry.attributes.normal) gg.setAttribute('normal',toFloat(o.geometry.attributes.normal));
      if(o.geometry.index) gg.setIndex(o.geometry.index);
      gg.applyMatrix4(o.matrixWorld);
      if(!gg.attributes.normal) gg.computeVertexNormals();
      gg.computeBoundingBox(); gg.computeBoundingSphere(); gg.computeBoundsTree();
      box.union(gg.boundingBox);
      prims.push({g:gg,name:o.material.name||'',hex:'#'+o.material.color.getHexString(THREE.SRGBColorSpace)});
    });
    return {prims,box};
  })();
  geoCache[sid]=p;
  p.catch(()=>{ if(geoCache[sid]===p) delete geoCache[sid]; });   // a failed fetch must be retryable
  return p;
}
/* kit color variant: replaces some CAD materials (usually the main body) with the kit color */
function overrides(sid,col){ const c=PART[sid].colors.find(x=>x.c===col)||PART[sid].colors[0]; return c.ov||{}; }
function partMeshes(sid,col,kind){
  const ov=overrides(sid,col);
  return geoCache[sid]._v.prims.map(pr=>{ const hex=ov[pr.name]||pr.hex, m=new THREE.Mesh(pr.g,mat(hex,kind)); m.userData.hex=hex; return m; });
}
async function ensureGeo(sid){ const g=await geo(sid); geoCache[sid]._v=g; return g; }
const geoAll=ids=>Promise.all(ids.map(ensureGeo));
function mat(hex,kind){
  const k=hex+(kind||''); if(matCache[k]) return matCache[k];
  const see=kind==='g'||kind==='d';   // g ghost of the part in hand, d dimmed part in showcase
  const m=new THREE.MeshStandardMaterial({color:hex,roughness:.55,metalness:.02,transparent:see,opacity:kind==='g'?.55:kind==='d'?.14:1,depthWrite:!see});
  if(kind==='s'){ m.emissive=new THREE.Color(css('--accent')); m.emissiveIntensity=.35; }
  return matCache[k]=m;
}

/* ---------- connectors ---------- */
const V=a=>new THREE.Vector3(a[0],a[1],a[2]);
const isF=k=>k[0]==='F', isM=k=>k[0]==='M';
function compat(a,b){ if(a[1]==='T'||b[1]==='T') return (a==='MT'&&b==='FT')||(a==='FT'&&b==='MT');   // tire on pulley rim only
  if(isF(a)&&isF(b)) return true; if(isM(a)&&isM(b)) return false; const m=isM(a)?a:b, f=isF(a)?a:b; return !(m==='MP'&&f==='FS'); }
function worldConns(i){
  const p=model.parts[i], P=PART[p.sid], q=new THREE.Quaternion(...p.q), tt=V(p.p);
  return P.conn.map((c,j)=>({i,j,k:c.k,p:V(c.p).applyQuaternion(q).add(tt),n:V(c.n).applyQuaternion(q).normalize()}));
}
let allConns=[], freeConns=[];
function rebuildConns(){
  allConns=[]; model.parts.forEach((_,i)=>allConns.push(...worldConns(i)));
  // spatial hash with neighbour lookup, so a pair straddling a cell edge still counts as occupied
  const CELL=2, cell=v=>Math.floor(v/CELL), key=(x,y,z)=>x+','+y+','+z;
  const bucket=new Map();
  for(const c of allConns){const k=key(cell(c.p.x),cell(c.p.y),cell(c.p.z)); let a=bucket.get(k); if(!a) bucket.set(k,a=[]); a.push(c);}
  const taken=c=>{
    const cx=cell(c.p.x),cy=cell(c.p.y),cz=cell(c.p.z);
    for(let x=cx-1;x<=cx+1;x++) for(let y=cy-1;y<=cy+1;y++) for(let z=cz-1;z<=cz+1;z++){
      const a=bucket.get(key(x,y,z)); if(!a) continue;
      for(const o of a) if(o.i!==c.i&&o.p.distanceToSquared(c.p)<.64&&o.n.dot(c.n)<-.9) return true;
    }
    return false;
  };
  freeConns=allConns.filter(c=>!taken(c));
}
function srcOptions(target){
  const P=PART[armed.sid]; const out=[];
  P.conn.forEach((c,j)=>{ if(compat(c.k,target.k)) out.push(j); });
  out.sort((a,b)=>(isM(P.conn[b].k)-isM(P.conn[a].k)));
  return out;
}
/* Pins and shafts (parts whose connectors are all male): options are grouped by which end goes in,
   and inside a group sorted from shallow to deep, so the user picks the end (T) and the depth (D or scroll). */
const maleOnly=sid=>PART[sid].conn.length>0&&PART[sid].conn.every(c=>isM(c.k));
function optGroups(target){
  if(!maleOnly(armed.sid)) return null;
  const P=PART[armed.sid], gs=new Map();
  for(const j of srcOptions(target)){ const n=P.conn[j].n, key=n.map(x=>Math.round(x*10)).join(','); if(!gs.has(key)) gs.set(key,[]); gs.get(key).push(j); }
  const out=[...gs.values()];
  for(const g of out){ const n=V(P.conn[g[0]].n); g.sort((a,b)=>V(P.conn[b].p).dot(n)-V(P.conn[a].p).dot(n)); }
  return out;
}
let depIdx=0;
function chosenOption(target){
  const gs=optGroups(target);
  if(gs&&gs.length){ const g=gs[((ptIdx%gs.length)+gs.length)%gs.length]; return {j:g[((depIdx%g.length)+g.length)%g.length],end:(ptIdx%gs.length+gs.length)%gs.length,ends:gs.length,dep:((depIdx%g.length)+g.length)%g.length,deps:g.length}; }
  const o=srcOptions(target); if(!o.length) return null;
  return {j:o[((ptIdx%o.length)+o.length)%o.length],idx:((ptIdx%o.length)+o.length)%o.length,n:o.length};
}
function snapPose(target,j,s){
  const c=PART[armed.sid].conn[j], nB=V(c.n), pB=V(c.p);
  const q1=new THREE.Quaternion().setFromUnitVectors(nB,target.n.clone().negate());
  const qs=new THREE.Quaternion().setFromAxisAngle(target.n,s*Math.PI/2);
  const q=qs.multiply(q1);
  const pos=target.p.clone().sub(pB.applyQuaternion(q));
  return {q,pos,dir:target.n.clone()};
}
function groundPose(pt){
  const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,0,1),spin*Math.PI/2).multiply(TILTS[tilt]);
  const b=PART[armed.sid].bounds; let minz=1e9;
  for(const x of [b[0][0],b[1][0]]) for(const y of [b[0][1],b[1][1]]) for(const z of [b[0][2],b[1][2]]) minz=Math.min(minz,new THREE.Vector3(x,y,z).applyQuaternion(q).z);
  const g=6.35, pos=new THREE.Vector3(Math.round(pt.x/g)*g,Math.round(pt.y/g)*g,-minz);
  return {q,pos,dir:new THREE.Vector3(0,0,1)};
}

/* ---------- scene sync ---------- */
const meshes=[]; let syncSeq=0;
async function syncScene(visibleUpTo=Infinity,animStep=null){
  const my=++syncSeq;
  await Promise.all([...new Set(model.parts.map(p=>p.sid))].map(ensureGeo));
  if(my!==syncSeq) return;               // a newer sync started while we awaited; it will draw
  root.clear(); meshes.length=0;         // clear only after the await so two syncs can never both add
  model.parts.forEach((p,i)=>{
    if(p.step>visibleUpTo) return;
    const home=V(p.p), dir=V(p.dir||[0,0,1]), anim=animStep!==null&&p.step===animStep;
    for(const m of partMeshes(p.sid,p.col,i===selected?'s':'')){
      m.position.copy(home); m.quaternion.fromArray(p.q); m.userData={i,home,dir,anim,hex:m.userData.hex};
      root.add(m); meshes.push(m);
    }
  });
  need();
  if(animStep!==null) runAnim();
}

/* dots */
const dotGeo=new THREE.SphereGeometry(1.4,12,8);
const dotMatF=new THREE.MeshBasicMaterial({color:0xffffff,depthTest:true});
const dotMatM=new THREE.MeshBasicMaterial({color:0xf4c21b});
let dotsF=null,dotsM=null, cand=[];
const hl=new THREE.Mesh(new THREE.TorusGeometry(4.2,.9,10,28),new THREE.MeshBasicMaterial({color:0x1f5fd1,depthTest:false,transparent:true}));
hl.renderOrder=10; hl.visible=false; scene.add(hl);
function rebuildDots(){
  for(const d of [dotsF,dotsM]) if(d){scene.remove(d); d.dispose();}
  cand=[];
  if(armed){ const ks=PART[armed.sid].conn.map(c=>c.k); cand=freeConns.filter(c=>ks.some(k=>compat(k,c.k))); }
  const f=cand.filter(c=>isF(c.k)), m=cand.filter(c=>isM(c.k));
  const mk=(arr,mt)=>{const im=new THREE.InstancedMesh(dotGeo,mt,Math.max(1,arr.length)); im.count=arr.length; const M=new THREE.Matrix4(); arr.forEach((c,k)=>{M.setPosition(c.p.clone().addScaledVector(c.n,.4)); im.setMatrixAt(k,M);}); scene.add(im); return im;};
  dotsF=mk(f,dotMatF); dotsM=mk(m,dotMatM); need();
}

/* ---------- ghost ---------- */
let ghost=null, pose=null;
async function updateGhost(){
  ghostRoot.clear(); ghost=null; pose=null; hl.visible=false; need();
  if(!armed||mode!=='build'||!hover) { updateHint(); return; }
  await ensureGeo(armed.sid);
  if(!armed||!hover) { updateHint(); return; }
  if(hover.type==='conn'){
    const ch=chosenOption(hover.c); if(!ch){updateHint();return;}
    pose=snapPose(hover.c,ch.j,spin);
    hl.position.copy(hover.c.p); hl.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),hover.c.n); hl.visible=true;
  } else pose=groundPose(hover.pt);
  ghostRoot.clear();
  ghost=new THREE.Group(); for(const m of partMeshes(armed.sid,armed.col,'g')) ghost.add(m);
  ghost.position.copy(pose.pos); ghost.quaternion.copy(pose.q); ghostRoot.add(ghost);
  updateHint(); need();
}
function updateHint(){
  if(PART&&CATALOG) refreshTools();
  const h=$('hintL');

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(); ray.firstHitOnly=true; const ndc=new THREE.Vector2();
function setNdc(e){const r=canvas.getBoundingClientRect(); ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); return r;}
function pick(e){
  const r=setNdc(e); ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(meshes,false);
  if(armed){
    let best=null,bd=26*26; const v=new THREE.Vector3();
    for(const c of cand){
      v.copy(c.p).project(camera); if(v.z>1) continue;
      const dx=(v.x-ndc.x)*r.width/2, dy=(v.y-ndc.y)*r.height/2, d=dx*dx+dy*dy;
      if(d<bd){ // occlusion
        const dist=camera.position.distanceTo(c.p);
        const rr=new THREE.Raycaster(camera.position,c.p.clone().sub(camera.position).normalize(),0,dist-3.5); rr.firstHitOnly=true;
        if(rr.intersectObjects(meshes,false).length) continue;

    if(best) return {type:'conn',c:best};
    if(!hits.length){ const pl=new THREE.Plane(new THREE.Vector3(0,0,1),0), pt=new THREE.Vector3(); if(ray.ray.intersectPlane(pl,pt)) return {type:'ground',pt}; }

}
function screenDist(p,e){ const r=canvas.getBoundingClientRect(), v=p.clone().project(camera); return Math.hypot((v.x+1)/2*r.width-(e.clientX-r.left),(1-v.y)/2*r.height-(e.clientY-r.top)); }

let down=null, moveEv=null, moveRaf=0;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener('pointermove',e=>{
  if(mode==='view'){ if(e.pointerType==='mouse'&&!e.buttons) viewPoint(e); return; }
  if(mode!=='build'||!armed||e.pointerType!=='mouse'||e.buttons) return;
  moveEv=e; if(moveRaf) return;           // at most one pick per frame
  if(lockHover) return;
  moveRaf=requestAnimationFrame(()=>{ moveRaf=0; const ev=moveEv; if(!ev||!armed||lockHover) return; const h=pick(ev);
    if(sameHover(h,hover)) return;
    if(hover&&hover.type==='conn'&&screenDist(hover.c.p,ev)<30) return;   // stay on the current hole until the mouse clearly leaves it, so T and R are not reset
    hover=h; ptIdx=0; depIdx=0; updateGhost(); });
});
canvas.addEventListener('pointerup',e=>{

/* ---------- take off and slide on a shaft ---------- */
let slideInfo=null, slideSnap=false;
const boxOn=(i,n)=>{   // interval of part i projected on direction n
  const p=model.parts[i], g=geoCache[p.sid]&&geoCache[p.sid]._v; if(!g) return null;
  const q=new THREE.Quaternion(...p.q), o=V(p.p), b=g.box; let lo=1e9, hi=-1e9;
  for(const x of [b.min.x,b.max.x]) for(const y of [b.min.y,b.max.y]) for(const z of [b.min.z,b.max.z]){ const d=new THREE.Vector3(x,y,z).applyQuaternion(q).add(o).dot(n); lo=Math.min(lo,d); hi=Math.max(hi,d); }
  return [lo,hi];
};
const onLine=(pt,a,n)=>pt.clone().sub(a).cross(n).length()<.6;
function eachVertex(j,fn){
  const p=model.parts[j], g=geoCache[p.sid]&&geoCache[p.sid]._v; if(!g) return;
  const q=new THREE.Quaternion(...p.q), o=V(p.p), v=new THREE.Vector3();
  for(const pr of g.prims){ const pa=pr.g.attributes.position; for(let k=0;k<pa.count;k++){ v.fromBufferAttribute(pa,k).applyQuaternion(q).add(o); fn(v); } }
}
function radialExtent(i,a,n){ let r=0; eachVertex(i,v=>{ const d=v.clone().sub(a); d.addScaledVector(n,-d.dot(n)); r=Math.max(r,d.length()); }); return Math.min(r,30); }
function axialRange(i,a,n,R){ let lo=1e9,hi=-1e9; eachVertex(i,v=>{ const d=v.clone().sub(a), ax=d.dot(n); if(d.addScaledVector(n,-ax).lengthSq()>R*R) return; const x=ax+a.dot(n); lo=Math.min(lo,x); hi=Math.max(hi,x); }); return lo<hi?[lo,hi]:null; }
/* a selected part slides when one of its shaft holes (FS) or pin holes (FP) sits on a shaft (MS connectors on the same line).
   Range: the shaft length, stopped by every other part threaded on the same line, so nothing overlaps. */
function computeSlide(i){
  const shaftC=worldConns(i).find(c=>c.k==='MS');
  if(shaftC&&maleOnly(model.parts[i].sid)){
    // the shaft itself moves: it must not run into material on its line, and must stay through every hole it already passes
    const a=shaftC.p, n=shaftC.n.clone().normalize(), R=1.0;
    const me=axialRange(i,a,n,R+2); if(!me) return null;
    let lo=-60, hi=60;
    model.parts.forEach((q,j)=>{
      if(j===i) return;
      eachVertex(j,v=>{ const d=v.clone().sub(a), ax=d.dot(n); if(d.addScaledVector(n,-ax).lengthSq()>R*R) return; const x=ax+a.dot(n);
        if(x<=me[0]+.05) lo=Math.max(lo,x-me[0]); else if(x>=me[1]-.05) hi=Math.min(hi,x-me[1]); });
      for(const w of worldConns(j)) if(w.k[0]==='F'&&onLine(w.p,a,n)){ const hpos=w.p.dot(n); if(hpos>=me[0]-.5&&hpos<=me[1]+.5){ lo=Math.max(lo,hpos+1-me[1]); hi=Math.min(hi,hpos-1-me[0]); } }
    });
    if(hi-lo<.25) return null;
    return {n,lo:Math.min(lo,0),hi:Math.max(hi,0),t:0,start:V(model.parts[i].p)};
  }
  const mine=worldConns(i).filter(c=>c.k==='FS'||c.k==='FP');
  for(const c of mine){
    const a=c.p, n=c.n.clone().normalize();
    const shaftIdx=model.parts.findIndex((q,j)=>j!==i&&PART[q.sid].conn.some(x=>x.k==='MS')&&worldConns(j).some(w=>w.k==='MS'&&Math.abs(Math.abs(w.n.dot(n))-1)<.02&&onLine(w.p,a,n)&&Math.abs(w.p.dot(n)-a.dot(n))<7));
    if(shaftIdx<0) continue;
    const sh=boxOn(shaftIdx,n); if(!sh) continue;
    // real geometry close to the shaft line, not bounding boxes: a wheel's tire is wide but its hub is narrow
    const R=radialExtent(i,a,n)+.3, me=axialRange(i,a,n,R); if(!me) continue;
    let lo=sh[0]-me[0], hi=sh[1]-me[1];
    model.parts.forEach((q,j)=>{
      if(j===i||j===shaftIdx) return;
      eachVertex(j,v=>{ const d=v.clone().sub(a), ax=d.dot(n); if(d.addScaledVector(n,-ax).lengthSq()>R*R) return; const x=ax+a.dot(n);
        if(x<=me[0]+.05) lo=Math.max(lo,x-me[0]); else if(x>=me[1]-.05) hi=Math.min(hi,x-me[1]); });
    });
    if(hi-lo<.25) continue;
    return {n,lo:Math.min(lo,0),hi:Math.max(hi,0),t:0,start:V(model.parts[i].p)};
  }
  return null;
}
function moveSelected(tv){

  p.p=np.toArray().map(x=>Math.round(x*1000)/1000);

  const t0=Math.min(1,(now-animT0)/700), e=1-Math.pow(1-t0,3);
  for(const m of meshes) if(m.userData.anim){ m.position.copy(m.userData.home).addScaledVector(m.userData.dir,(1-e)*70); }

}

  if(b.isEmpty()) for(const m of meshes) b.expandByObject(m);
  if(b.isEmpty()) return;
  const c=b.getCenter(new THREE.Vector3()), r=b.getSize(new THREE.Vector3()).length()/2;

  const b=new THREE.Box3(); for(const m of meshes) b.expandByObject(m);
  if(b.isEmpty()) return gal={key,imgs:[]};
  const c=b.getCenter(new THREE.Vector3()), rad=b.getSize(new THREE.Vector3()).length()/2;
  const cam=camera.clone(), vf=cam.fov*Math.PI/360, hf=Math.atan(Math.tan(vf)*cam.aspect), d=Math.max(90,rad/Math.sin(Math.min(vf,hf))*1.05), el=24*Math.PI/180;
  const vis=[ghostRoot.visible,hl.visible]; ghostRoot.visible=false; hl.visible=false;
  const cc=new THREE.Color(), ca=renderer.getClearAlpha(); renderer.getClearColor(cc); renderer.setClearColor(new THREE.Color(css('--mat')||'#e3e9f0'),1);   // JPEG has no alpha, paint the mat color behind

    const a=-Math.PI/2+k*Math.PI/5;

    renderer.render(scene,cam); imgs.push(renderer.domElement.toDataURL('image/jpeg',.85));

function saveDraft(){

  }catch{}

const num3=a=>Array.isArray(a)&&a.length===3&&a.every(x=>typeof x==='number'&&isFinite(x)&&Math.abs(x)<5000);
function cleanModel(m){
  if(!m||typeof m!=='object'||!Array.isArray(m.parts)) throw new Error('bad model');
  const parts=[];
  for(const p of m.parts.slice(0,MAX_PARTS)){
    if(!p||typeof p!=='object') continue;
    const P=PART[p.sid]; if(!P) continue;
    if(!num3(p.p)||!Array.isArray(p.q)||p.q.length!==4||!p.q.every(x=>typeof x==='number'&&isFinite(x))) continue;
    const ql=Math.hypot(...p.q); if(ql<1e-6) continue;
    const c=P.colors.find(c=>c.c===p.col)||P.colors[0];
    const step=Math.min(999,Math.max(1,Math.floor(Number(p.step))||1));
    parts.push({sid:p.sid,col:c.c,hex:c.hex,p:p.p.slice(),q:p.q.map(x=>x/ql),dir:num3(p.dir)?p.dir.slice():[0,0,1],step});
  }
  let ref=null; try{ const u=new URL(String(m.ref||'')); if(u.protocol==='https:') ref=u.href; }catch{}   // never let a shared file inject a javascript: link
  const maxStep=Math.max(1,...parts.map(p=>p.step));
  return {name:String(m.name||'').slice(0,80),parts,step:Math.max(maxStep,Math.min(999,Math.floor(Number(m.step))||1)),ref};
}

function snapThumb(){

    const vis=[ghostRoot.visible,hl.visible,dotsF&&dotsF.visible,dotsM&&dotsM.visible];
    ghostRoot.visible=false; hl.visible=false; if(dotsF) dotsF.visible=false; if(dotsM) dotsM.visible=false;

    const x=c.getContext('2d'); x.fillStyle=css('--mat')||'#e3e9f0'; x.fillRect(0,0,W,H);
    const k=Math.max(W/src.width,H/src.height); x.drawImage(src,(W-src.width*k)/2,(H-src.height*k)/2,src.width*k,src.height*k);
    ghostRoot.visible=vis[0]; hl.visible=vis[1]; if(dotsF) dotsF.visible=vis[2]; if(dotsM) dotsM.visible=vis[3]; need();

function applySizes(){

  main.style.setProperty('--side-w',sizes.side+'px'); main.classList.toggle('side-off',sizes.side<1);

function dragHandle(el,key,axis,min,maxFn){
  let start=null;
  el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.setPointerCapture(e.pointerId); start={c:axis==='x'?e.clientX:e.clientY,v:sizes[key]}; el.classList.add('drag'); document.body.classList.add('resizing'); });
  el.addEventListener('pointermove',e=>{ if(!start) return; const d=(axis==='x'?e.clientX:e.clientY)-start.c;
    let v=start.v+(axis==='x'?d:-d); v=Math.max(0,Math.min(maxFn(),v)); if(v<min) v=v<min/2?0:min; sizes[key]=Math.round(v); applySizes(); });
  const end=()=>{ if(!start) return; start=null; el.classList.remove('drag'); document.body.classList.remove('resizing'); if(sizes[key]>0) sizes[key+'Old']=sizes[key]; applySizes(); };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  const toggle=()=>{ sfx('ui'); if(sizes[key]>0){ sizes[key+'Old']=sizes[key]; sizes[key]=0; } else sizes[key]=sizes[key+'Old']||(key==='side'?300:220); applySizes(); };
  el.addEventListener('dblclick',toggle);
  el.addEventListener('keydown',e=>{ const step=e.shiftKey?60:20;
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); return; }
    const grow=axis==='x'?{ArrowRight:1,ArrowLeft:-1}:{ArrowUp:1,ArrowDown:-1}; if(!(e.key in grow)) return;
    e.preventDefault(); sizes[key]=Math.max(0,Math.min(maxFn(),sizes[key]+grow[e.key]*step)); applySizes(); });
}

  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{el.title=t(el.dataset.i18nTitle);});
  if($('bFull')) renderFull();
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.i18nAria));});
  $('lTh').setAttribute('aria-pressed',lang==='th'); $('lEn').setAttribute('aria-pressed',lang==='en');
  if(isDefaultName(model.name)){ model.name=t('newModel'); }
  $('mname').value=displayName(model.name);
  if($('loading')&&!$('loading').hidden) $('loading').textContent=t('loading');
  renderTabs(); renderLib(); renderBOM(); updateHint(); if($('bSnd')) renderSnd();
  if(mode==='view') renderViewParts();
  if(mode==='instr'&&model.parts.length){ const k=stepIdx; showStep(k); } else if(mode==='instr'){ showStep(0); }
}
function setLang(l){ lang=l; try{localStorage.setItem('vexgo-lang',l);}catch{} applyLang(); }
$('lTh').onclick=()=>{sfx('ui'); setLang('th');}; $('lEn').onclick=()=>{sfx('ui'); setLang('en');};

/* ---------- boot ---------- */
function loop(now){
  requestAnimationFrame(loop);
  const anim=animate(now);
  const moved=controls.update();
  if(anim||moved||dirty){ dirty=false; renderer.render(scene,camera); }
}
(async()=>{
  $('loading').textContent=t('loading'); applyLang();
  try{ CATALOG=await fetchJson('parts.json'); }catch{ $('loading').textContent=t('bootFail'); return; }
  for(const p of CATALOG.parts) PART[p.id]=p;
  renderTabs(); renderLib(); renderBOM(); resize(); requestAnimationFrame(loop);
  let start=null;
  try{
    const d=JSON.parse(localStorage.getItem('vexgo-draft')||'null');
    if(d&&d.edited&&d.model&&Array.isArray(d.model.parts)&&d.model.parts.length) start={model:d.model,modelId:d.modelId,src:null};
    else if(d&&d.src&&/^[\w.-]+\.json$/.test(d.src)) start={model:await fetchJson(d.src),modelId:null,src:d.src};
  }catch{}
  if(!start){ try{ const list=await fetchJson('models.json'); start={model:await fetchJson(list[0].file),modelId:null,src:list[0].file}; }catch{} }
  if(start) await loadModel(start.model,start.modelId,start.src);
  $('loading').hidden=true; updateHint();
  if(location.hash==='#instructions') setMode('instr'); else if(location.hash==='#showcase') setMode('view');
  if(window.claude&&claude.use){ claude.use('db').then(d=>{db=d;}).catch(()=>{}); }
})();
window.__vx={THREE, geo:sid=>geoCache[sid]&&geoCache[sid]._v, compat:(a,b)=>compat(a,b), select:i=>selectPart(i), slide:()=>slideInfo&&{lo:slideInfo.lo,hi:slideInfo.hi,t:slideInfo.t}, moveSel:v=>{snapshot();moveSelected(v);rebuildConns();}, pickUp:()=>$('tPick').click(), armedNow:()=>armed&&armed.sid, candScreen:k=>{const r=canvas.getBoundingClientRect(); const c=cand[k||0]; if(!c) return null; const v=c.p.clone().project(camera); return [r.left+(v.x+1)/2*r.width, r.top+(1-v.y)/2*r.height];}, state:()=>({ptIdx,spin,lock:lockHover,hover:hover&&hover.type,ctl:controls.enabled,hint:$('hintL').textContent}), meshCount:()=>[meshes.length,root.children.length],cam:(pos,tgt)=>{camera.position.set(...pos);controls.target.set(...tgt);controls.update();need();}, grid:v=>{grid.visible=v;need();}, get model(){return model}, PART:()=>PART, setArmed:(sid,col)=>{const P=PART[sid];const c=P.colors.find(x=>x.c===col)||P.colors[0];armed={sid,col:c.c,hex:c.hex};}, freeConns:()=>freeConns, snapPose:(tg,j,s)=>snapPose(tg,j,s), srcOptions:tg=>srcOptions(tg), groundPose:p=>groundPose(p), place:ps=>{pose=ps;place();}, afterChange, loadModel, ensureGeo, setSpin:s=>spin=s, setTilt:v=>tilt=v, newStep:()=>$('tStep').click(), setMode, frame, setLang};
