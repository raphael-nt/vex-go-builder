name: Supabase keepalive

# Calls a read only RPC every 3 days so the free Supabase project is not paused.
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call a read only RPC
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/vexgo_list"             -H "apikey: ${{ secrets.SUPABASE_KEY }}"             -H "Content-Type: application/json"             -d '{"p_space":"keepalive"}'
